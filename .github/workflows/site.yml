name: Refresh NGDP and publish website
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 17 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academic-site
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: python -m pip install -r tools/requirements.txt
      - name: Check refresh failure and revision handling
        run: python -m unittest discover -s tools/tests -v
      - name: Refresh public data
        if: github.event_name != 'push'
        run: python tools/refresh_ngdp.py
      - name: Preserve the validated data vintage
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/raw tools/source_manifest.json assets/data/ngdp.js assets/data/ngdp-windows.csv index.html ngdp.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh NGDP data from public sources'
            git push origin HEAD:main
          fi
      - name: Stage public website files
        run: |
          mkdir _site
          cp *.html CNAME _site/
          cp -R assets tools _site/
          rm -rf _site/tools/tests _site/tools/__pycache__
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete website snapshot
        id: deployment
        uses: actions/deploy-pages@v4
